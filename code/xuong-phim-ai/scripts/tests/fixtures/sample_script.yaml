scenes:
  - id: "s01"
    act: "Setup"
    vi_narrator: "Sau một cơn mưa, Minh nhìn lên bầu trời và thấy một cầu vồng rực rỡ. Minh tự hỏi: màu sắc đó từ đâu ra?"
    en_narrator: "After the rain, Minh looks up and spots a brilliant rainbow stretching across the sky. Where do all those colors come from?"
    duration_sec: 30

  - id: "s02"
    act: "Setup"
    vi_narrator: "An — người bạn khoa học của Minh — đặt một câu hỏi khiến Minh bất ngờ: 'Theo em, ánh sáng trắng có màu không?'"
    en_narrator: "An — Minh's science-minded friend — asks a question that stops Minh cold: 'Do you think white light actually has color in it?'"
    vi_dialogue:
      - character: "Minh"
        line: "Có màu á? Trắng là trắng mà, làm gì có màu!"
      - character: "An"
        line: "Hm... chắc chắn vậy không? Mình thử xem nhé."
    en_dialogue:
      - character: "Minh"
        line: "Color? White is white — there's no color in it!"
      - character: "An"
        line: "Hmm... you sure about that? Let's find out."
    duration_sec: 35

  - id: "s03"
    act: "Exploration"
    vi_narrator: "An lấy một lăng kính thủy tinh ra. Minh chiếu đèn pin qua đó — và trên tường xuất hiện một dải cầu vồng hoàn hảo."
    en_narrator: "An pulls out a glass prism. Minh shines a flashlight through it — and a perfect rainbow strip appears on the wall behind."
    vi_dialogue:
      - character: "Minh"
        line: "Thấy chưa! Lăng kính tạo ra màu từ ánh sáng trắng. Chứng minh rồi đó!"
    en_dialogue:
      - character: "Minh"
        line: "See! The prism creates color from white light. Proven!"
    duration_sec: 40

  - id: "s04"
    act: "Exploration"
    vi_narrator: "An đề nghị thử che từng màu trong quang phổ. Minh che màu đỏ — và phía sau lăng kính, màu đỏ biến mất hoàn toàn."
    en_narrator: "An suggests blocking individual colors from the spectrum. Minh blocks the red band — and on the other side of the prism, red disappears completely."
    vi_dialogue:
      - character: "Minh"
        line: "Ừ... nhưng đó chỉ là vì mình che nó lại thôi mà."
      - character: "An"
        line: "Đúng. Nhưng nếu lăng kính tạo ra màu, tại sao che trước lăng kính lại mất màu sau?"
    en_dialogue:
      - character: "Minh"
        line: "Yeah... but that's just because we're blocking it."
      - character: "An"
        line: "Right. But if the prism creates color, why does blocking light before the prism remove color after it?"
    duration_sec: 45

  - id: "s05"
    act: "Exploration"
    vi_narrator: "Minh nghĩ ra phản bác: có thể ánh sáng bị 'ô nhiễm' khi đi qua tay che. Hai người thử che bằng tấm bìa có lỗ nhỏ — kết quả vẫn y chang."
    en_narrator: "Minh comes up with a counter-argument: maybe light gets contaminated passing through the hand. They try blocking with a card with a tiny hole — same result."
    duration_sec: 40

  - id: "s06"
    act: "Exploration"
    vi_narrator: "An đặt câu hỏi mới: nếu lăng kính tạo ra màu, thì hai lăng kính chắc tạo ra nhiều màu hơn. Minh hào hứng thử — nhưng quang phổ không thay đổi gì cả."
    en_narrator: "An poses a new test: if the prism creates color, then two prisms should create even more colors. Minh excitedly tries it — but the spectrum doesn't change at all."
    vi_dialogue:
      - character: "Minh"
        line: "Lạ thật... Không nhiều hơn à?"
    en_dialogue:
      - character: "Minh"
        line: "That's weird... no extra colors?"
    duration_sec: 40

  - id: "s07"
    act: "Exploration"
    vi_narrator: "Rồi An lấy lăng kính thứ hai úp ngược chiều. Minh chiếu chùm sáng đã tán sắc vào đó — và phép màu xảy ra: màu sắc hội tụ lại thành ánh sáng trắng."
    en_narrator: "Then An flips a second prism upside down. Minh shines the split spectrum through it — and something remarkable happens: the colors converge back into white light."
    vi_dialogue:
      - character: "Minh"
        line: "Khoan... trắng lại rồi? Làm sao được?"
      - character: "An"
        line: "Đó chính là câu hỏi quan trọng nhất."
    en_dialogue:
      - character: "Minh"
        line: "Wait... it's white again? How?"
      - character: "An"
        line: "That's the most important question."
    duration_sec: 50

  - id: "s08"
    act: "Revelation"
    vi_narrator: "Minh ngồi lại suy nghĩ. Nếu lăng kính tạo ra màu, thì lăng kính thứ hai không thể lấy màu đó đi. Nhưng thực tế nó làm được. Vậy màu không phải do lăng kính tạo ra — màu đã có sẵn trong ánh sáng trắng từ trước."
    en_narrator: "Minh sits back and thinks. If the prism created the colors, the second prism couldn't take them away. But it did. So the colors weren't created by the prism — they were already hiding inside white light."
    vi_dialogue:
      - character: "Minh"
        line: "Vậy ánh sáng trắng... thực ra là tổng hợp của tất cả màu sắc?"
      - character: "An"
        line: "Chính xác. Newton phát hiện điều này năm 1666."
    en_dialogue:
      - character: "Minh"
        line: "So white light... is actually all colors combined?"
      - character: "An"
        line: "Exactly. Newton figured this out in 1666."
    duration_sec: 55

  - id: "s09"
    act: "Revelation"
    vi_narrator: "Và bây giờ mọi thứ có nghĩa hơn: màn hình điện thoại chỉ cần 3 màu đỏ, xanh lá, xanh dương để tạo ra hàng triệu màu khác nhau. Cầu vồng là những giọt nước mưa đóng vai lăng kính, tán sắc ánh sáng mặt trời. Ánh sáng trắng không phải trắng thuần túy — nó là tất cả màu sắc đang nắm tay nhau."
    en_narrator: "And now everything makes sense: your phone screen only needs three colors — red, green, blue — to create millions of shades. A rainbow is just raindrops acting as millions of tiny prisms, splitting sunlight apart. White light isn't pure white — it's all colors, holding hands."
    duration_sec: 60

