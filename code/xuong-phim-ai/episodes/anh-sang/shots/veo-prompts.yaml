# Character modules (reusable across all shots)
# MINH: chibi anime boy, large round head, big expressive dark brown eyes with round pupils,
#        rosy cheeks, small button nose, dark spiky-fluffy black hair, warm light tan skin,
#        white short-sleeve t-shirt, dark navy shorts, fully rendered cartoon arms and hands,
#        Studio Ghibli-inspired 2D hand-drawn animation style
# AN:   chibi anime character, large round head, calm gentle almond eyes, neat short dark hair,
#        warm light tan skin, white lab coat over light blue shirt, fully rendered cartoon body,
#        Studio Ghibli-inspired 2D hand-drawn animation style
# BG-OUTDOOR: warm sandy ground, patches of green grass, light blue sky with soft white clouds,
#              2D painterly background, Ghibli art style, warm natural daylight
# BG-LAB:     warm indoor lab, wooden paneled walls, shelves with glass beakers and flasks,
#              golden ambient lighting, 2D painterly background, Ghibli art style

- shot_id: sh01
  scene_id: s01
